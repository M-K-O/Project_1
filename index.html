<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geräte-Board</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #fff;
        --text: #1b1f27;
        --muted: #6a7280;
        --line: #e3e6ec;
        --accent: #2f6fed;
        --me: #e8f0ff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161b;
          --card: #1d2027;
          --text: #eceef3;
          --muted: #98a0b0;
          --line: #2b2f39;
          --accent: #6b9bff;
          --me: #22314f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .me {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 20px;
      }
      .me small {
        color: var(--muted);
        display: block;
      }
      .me strong {
        font-size: 1.6rem;
        color: var(--accent);
        letter-spacing: 0.03em;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .count {
        color: var(--muted);
        font-size: 0.9rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      li:last-child {
        border-bottom: 0;
      }
      li.mine {
        background: var(--me);
      }
      .nr {
        min-width: 2.2em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .code {
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .dev {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: right;
      }
      .tag {
        font-size: 0.72rem;
        background: var(--accent);
        color: #fff;
        border-radius: 99px;
        padding: 1px 8px;
      }
      .msg {
        color: var(--muted);
        padding: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Geräte-Board</h1>
      <p class="sub">
        Jedes Gerät, das diese Seite öffnet, wird registriert und erscheint mit
        seiner ID in der Liste.
      </p>
      <section class="me" id="me" hidden>
        <small>Deine Geräte-ID</small>
        <strong id="myid">–</strong>
      </section>
      <div class="head">
        <h2 style="font-size: 1.05rem; margin: 0">Registrierte Geräte</h2>
        <span class="count" id="count"></span>
      </div>
      <ul id="list">
        <li class="msg">Verbinde …</li>
      </ul>
    </main>
    <script>
      // === HIER EINTRAGEN (Supabase → Project Settings → API) ===
      var SUPABASE_URL = "https://abedlprtacoplkuuzcxm.supabase.co/rest/v1/";
      var SUPABASE_KEY = "sb_publishable_57vn_u0QVk-_hLZwmwKYlw_lNiznF7A";
      // ==========================================================

      var API = SUPABASE_URL + "/rest/v1/devices";
      var HEAD = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
      var listEl = document.getElementById("list"),
        countEl = document.getElementById("count"),
        meEl = document.getElementById("me"),
        myIdEl = document.getElementById("myid");
      var mem = {};
      function store(k, v) {
        try {
          if (v === undefined) return localStorage.getItem(k);
          localStorage.setItem(k, v);
        } catch (e) {
          if (v === undefined) return mem[k] || null;
          mem[k] = v;
        }
      }
      function rnd(n, al) {
        var s = "";
        for (var i = 0; i < n; i++)
          s += al[Math.floor(Math.random() * al.length)];
        return s;
      }
      var token = store("device-token");
      if (!token) {
        token = rnd(24, "abcdefghijklmnopqrstuvwxyz0123456789");
        store("device-token", token);
      }
      function label() {
        var u = navigator.userAgent,
          os = "Gerät",
          br = "";
        if (/iPhone/.test(u)) os = "iPhone";
        else if (/iPad/.test(u)) os = "iPad";
        else if (/Android/.test(u)) os = "Android";
        else if (/Windows/.test(u)) os = "Windows";
        else if (/Mac OS X/.test(u)) os = "Mac";
        else if (/Linux/.test(u)) os = "Linux";
        if (/Edg\//.test(u)) br = "Edge";
        else if (/Firefox\//.test(u)) br = "Firefox";
        else if (/Chrome\//.test(u)) br = "Chrome";
        else if (/Safari\//.test(u)) br = "Safari";
        return br ? os + " · " + br : os;
      }
      function msg(t) {
        listEl.innerHTML = "";
        var li = document.createElement("li");
        li.className = "msg";
        li.textContent = t;
        listEl.appendChild(li);
      }

      async function register() {
        // Bereits vorhandene IDs werden ignoriert (ON CONFLICT DO NOTHING)
        var r = await fetch(API + "?on_conflict=id", {
          method: "POST",
          headers: Object.assign(
            { Prefer: "resolution=ignore-duplicates,return=minimal" },
            HEAD,
          ),
          body: JSON.stringify({
            id: token,
            code: "GER-" + rnd(4, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"),
            device: label(),
          }),
        });
        if (!r.ok) throw new Error("write");
      }
      async function refresh() {
        var r = await fetch(
          API + "?select=id,code,device,created_at&order=created_at.asc",
          { headers: HEAD },
        );
        if (!r.ok) throw new Error("read");
        var rows = await r.json();
        listEl.innerHTML = "";
        var mine = null;
        rows.forEach(function (v, i) {
          var isMe = v.id === token;
          if (isMe) mine = { nr: i + 1, code: v.code };
          var li = document.createElement("li");
          if (isMe) li.className = "mine";
          var nr = document.createElement("span");
          nr.className = "nr";
          nr.textContent = "#" + (i + 1);
          var code = document.createElement("span");
          code.className = "code";
          code.textContent = v.code;
          li.appendChild(nr);
          li.appendChild(code);
          if (isMe) {
            var t = document.createElement("span");
            t.className = "tag";
            t.textContent = "Du";
            li.appendChild(t);
          }
          var dev = document.createElement("span");
          dev.className = "dev";
          dev.textContent = v.device || "";
          li.appendChild(dev);
          listEl.appendChild(li);
        });
        if (!rows.length) msg("Noch keine Geräte registriert.");
        countEl.textContent =
          rows.length + (rows.length === 1 ? " Gerät" : " Geräte");
        if (mine) {
          meEl.hidden = false;
          myIdEl.textContent = "#" + mine.nr + " · " + mine.code;
        }
      }
      (async function () {
        if (SUPABASE_URL.indexOf("DEIN-PROJEKT") > -1) {
          msg("Bitte zuerst SUPABASE_URL und SUPABASE_KEY im Code eintragen.");
          return;
        }
        try {
          await register();
          await refresh();
        } catch (e) {
          msg("Verbindungsfehler. Prüfe URL, Key und die Tabellen-Regeln.");
          return;
        }
        setInterval(function () {
          refresh().catch(function () {});
        }, 3000);
      })();
    </script>
  </body>
</html>
