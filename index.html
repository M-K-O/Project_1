<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geräte-Board</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #fff;
        --text: #1b1f27;
        --muted: #6a7280;
        --line: #e3e6ec;
        --accent: #2f6fed;
        --me: #e8f0ff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161b;
          --card: #1d2027;
          --text: #eceef3;
          --muted: #98a0b0;
          --line: #2b2f39;
          --accent: #6b9bff;
          --me: #22314f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .me {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 20px;
      }
      .me small {
        color: var(--muted);
        display: block;
      }
      .me strong {
        font-size: 1.6rem;
        color: var(--accent);
        letter-spacing: 0.03em;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .count {
        color: var(--muted);
        font-size: 0.9rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      li:last-child {
        border-bottom: 0;
      }
      li.mine {
        background: var(--me);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2fb344;
        flex: none;
      }
      .nr {
        min-width: 2.2em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .code {
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .dev {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: right;
      }
      .tag {
        font-size: 0.72rem;
        background: var(--accent);
        color: #fff;
        border-radius: 99px;
        padding: 1px 8px;
      }
      .msg {
        color: var(--muted);
        padding: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Geräte-Board</h1>
      <p class="sub">
        Jedes Gerät erscheint mit seiner ID in der Liste, solange es diese Seite
        geöffnet hat. Schließt es die Seite, verschwindet es sofort.
      </p>
      <section class="me" id="me" hidden>
        <small>Deine Geräte-ID</small>
        <strong id="myid">–</strong>
      </section>
      <div class="head">
        <h2 style="font-size: 1.05rem; margin: 0">Jetzt online</h2>
        <span class="count" id="count"></span>
      </div>
      <ul id="list">
        <li class="msg">Verbinde …</li>
      </ul>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
    <script>
      // === HIER EINTRAGEN (Supabase → Project Settings → API) ===
      var SUPABASE_URL = "https://abedlprtacoplkuuzcxm.supabase.co";
      var SUPABASE_KEY = "sb_publishable_57vn_u0QVk-_hLZwmwKYlw_lNiznF7A";
      // ==========================================================

      var listEl = document.getElementById("list"),
        countEl = document.getElementById("count"),
        meEl = document.getElementById("me"),
        myIdEl = document.getElementById("myid");
      var mem = {};
      function store(k, v) {
        try {
          if (v === undefined) return localStorage.getItem(k);
          localStorage.setItem(k, v);
        } catch (e) {
          if (v === undefined) return mem[k] || null;
          mem[k] = v;
        }
      }
      function rnd(n, al) {
        var s = "";
        for (var i = 0; i < n; i++)
          s += al[Math.floor(Math.random() * al.length)];
        return s;
      }
      function label() {
        var u = navigator.userAgent,
          os = "Gerät",
          br = "";
        if (/iPhone/.test(u)) os = "iPhone";
        else if (/iPad/.test(u)) os = "iPad";
        else if (/Android/.test(u)) os = "Android";
        else if (/Windows/.test(u)) os = "Windows";
        else if (/Mac OS X/.test(u)) os = "Mac";
        else if (/Linux/.test(u)) os = "Linux";
        if (/Edg\//.test(u)) br = "Edge";
        else if (/Firefox\//.test(u)) br = "Firefox";
        else if (/Chrome\//.test(u)) br = "Chrome";
        else if (/Safari\//.test(u)) br = "Safari";
        return br ? os + " · " + br : os;
      }
      function msg(t) {
        listEl.innerHTML = "";
        var li = document.createElement("li");
        li.className = "msg";
        li.textContent = t;
        listEl.appendChild(li);
      }

      // Dauerhafte Geräte-ID (pro Browser) und Code
      var token = store("device-token");
      if (!token) {
        token = rnd(24, "abcdefghijklmnopqrstuvwxyz0123456789");
        store("device-token", token);
      }
      var code = store("device-code");
      if (!code) {
        code = "GER-" + rnd(4, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789");
        store("device-code", code);
      }

      function render(state) {
        // state: { schluessel: [ {code, device, joinedAt}, ... ] }
        var rows = Object.keys(state)
          .map(function (key) {
            var metas = state[key];
            var first = metas.reduce(function (a, b) {
              return (a.joinedAt || 0) <= (b.joinedAt || 0) ? a : b;
            });
            return {
              key: key,
              code: first.code,
              device: first.device,
              joinedAt: first.joinedAt || 0,
            };
          })
          .sort(function (a, b) {
            return a.joinedAt - b.joinedAt || (a.key < b.key ? -1 : 1);
          });

        listEl.innerHTML = "";
        var mine = null;
        rows.forEach(function (v, i) {
          var isMe = v.key === token;
          if (isMe) mine = { nr: i + 1, code: v.code };
          var li = document.createElement("li");
          if (isMe) li.className = "mine";
          var dot = document.createElement("span");
          dot.className = "dot";
          var nr = document.createElement("span");
          nr.className = "nr";
          nr.textContent = "#" + (i + 1);
          var c = document.createElement("span");
          c.className = "code";
          c.textContent = v.code;
          li.appendChild(dot);
          li.appendChild(nr);
          li.appendChild(c);
          if (isMe) {
            var t = document.createElement("span");
            t.className = "tag";
            t.textContent = "Du";
            li.appendChild(t);
          }
          var dev = document.createElement("span");
          dev.className = "dev";
          dev.textContent = v.device || "";
          li.appendChild(dev);
          listEl.appendChild(li);
        });
        if (!rows.length) msg("Niemand online.");
        countEl.textContent = rows.length + " online";
        if (mine) {
          meEl.hidden = false;
          myIdEl.textContent = "#" + mine.nr + " · " + mine.code;
        }
      }

      (function () {
        if (SUPABASE_URL.indexOf("DEIN-PROJEKT") > -1) {
          msg("Bitte zuerst SUPABASE_URL und SUPABASE_KEY im Code eintragen.");
          return;
        }
        if (!window.supabase) {
          msg("Die Supabase-Bibliothek konnte nicht geladen werden.");
          return;
        }
        var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        var channel = client.channel("geraete-board", {
          config: { presence: { key: token } },
        });

        var timer = setTimeout(function () {
          msg("Verbindungsfehler. Prüfe URL und Key.");
        }, 10000);

        channel
          .on("presence", { event: "sync" }, function () {
            clearTimeout(timer);
            render(channel.presenceState());
          })
          .subscribe(async function (status) {
            if (status === "SUBSCRIBED") {
              await channel.track({
                code: code,
                device: label(),
                joinedAt: Date.now(),
              });
            } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
              clearTimeout(timer);
              msg("Verbindungsfehler. Prüfe URL und Key.");
            }
          });

        // Sauber abmelden beim Schließen der Seite
        window.addEventListener("pagehide", function () {
          channel.untrack();
          client.removeChannel(channel);
        });
      })();
    </script>
  </body>
</html>
