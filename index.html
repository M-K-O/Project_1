<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Beat’em-up Koop</title>
    <style>
      :root {
        --bg: #0e1015;
        --card: rgba(24, 28, 38, 0.88);
        --text: #eceef3;
        --muted: #98a0b0;
        --line: #2b2f39;
        --accent: #6b9bff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #252a33;
        color: var(--text);
        padding: 10px 14px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #0b1220;
        border-color: var(--accent);
        font-weight: 700;
      }
      button.big {
        width: 100%;
        padding: 14px;
        font-size: 1.1rem;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .muted {
        color: var(--muted);
      }
      h2 {
        font-size: 0.95rem;
        margin: 12px 0 6px;
        color: var(--muted);
        font-weight: 600;
      }
      #lobby {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: calc(10px + env(safe-area-inset-top)) 14px
          calc(12px + env(safe-area-inset-bottom));
        background: radial-gradient(
          120% 80% at 50% 30%,
          #26324f 0,
          #0e1015 70%
        );
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .titlebox {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 8px 0;
      }
      .logo {
        width: min(92vw, 480px);
        max-height: 100%;
        filter: drop-shadow(0 6px 18px rgba(229, 72, 77, 0.45));
      }
      #titleImg {
        max-width: 92vw;
        max-height: 100%;
        object-fit: contain;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        max-width: 520px;
        width: 100%;
        margin: 0 auto;
      }
      .code {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--accent);
      }
      .rooms {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 22dvh;
        overflow: auto;
      }
      .rooms li {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #252a33;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 14px;
      }
      .rooms li.room {
        cursor: pointer;
      }
      .rooms li.room:active {
        border-color: var(--accent);
      }
      .rooms li.full {
        opacity: 0.55;
        cursor: default;
      }
      .rooms .cnt {
        margin-left: auto;
        font-weight: 700;
        color: var(--accent);
      }
      .rooms .tag {
        font-size: 0.72rem;
        background: var(--accent);
        color: #0b1220;
        border-radius: 99px;
        padding: 1px 8px;
      }
      .status {
        color: var(--muted);
        margin-top: 8px;
        min-height: 1.3em;
        font-size: 0.9rem;
      }
      #mute {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        right: 10px;
        z-index: 5;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.4);
      }
      #game {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #07080c;
      }
      canvas {
        width: min(100vw, calc(100dvh * 2));
        height: auto;
        aspect-ratio: 2/1;
        display: block;
        touch-action: none;
      }
      .hud {
        position: fixed;
        top: calc(6px + env(safe-area-inset-top));
        left: 10px;
        font-size: 0.75rem;
        color: var(--muted);
        pointer-events: none;
      }
      .pad {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        justify-content: space-between;
        align-items: flex-end;
        padding: 10px 18px calc(12px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      .pad > * {
        pointer-events: auto;
      }
      @media (pointer: coarse), (max-width: 700px) {
        .pad {
          display: flex;
        }
      }
      .joy {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.25);
        position: relative;
        touch-action: none;
        flex: none;
      }
      .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 56px;
        height: 56px;
        margin: -28px 0 0 -28px;
        border-radius: 50%;
        background: rgba(107, 155, 255, 0.75);
        pointer-events: none;
      }
      .btns {
        display: flex;
        gap: 14px;
        align-items: flex-end;
      }
      .pad .btns button {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        padding: 0;
        font-size: 1.8rem;
        line-height: 1.1;
        touch-action: none;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      .pad .btns button small {
        display: block;
        font-size: 0.7rem;
        color: var(--muted);
      }
      #bK {
        width: 96px !important;
        height: 96px !important;
      }
      #btnAgain {
        position: fixed;
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <section id="lobby">
      <div class="topbar"><span class="muted" id="online"></span></div>
      <div class="titlebox">
        <svg
          class="logo"
          id="logo"
          viewBox="0 0 400 200"
          role="img"
          aria-label="Beat’em-up Koop"
        >
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe27a" />
              <stop offset="1" stop-color="#e5484d" />
            </linearGradient>
          </defs>
          <g
            transform="skewX(-8) translate(18 0)"
            font-family="Impact,Haettenschweiler,'Arial Black',sans-serif"
            font-weight="900"
            stroke="#12141a"
            stroke-width="7"
            paint-order="stroke"
            stroke-linejoin="round"
          >
            <text x="14" y="82" font-size="82" fill="url(#lg)">BEAT’EM</text>
            <text x="86" y="158" font-size="82" fill="url(#lg)">UP!</text>
            <text x="236" y="156" font-size="38" fill="#6b9bff">KOOP</text>
          </g>
        </svg>
        <img id="titleImg" alt="Titelbild" hidden />
      </div>
      <div class="panel">
        <div id="lobbyView">
          <button class="primary big" id="btnOpen">Raum öffnen</button>
          <h2>Offene Räume</h2>
          <ul class="rooms" id="rooms"></ul>
        </div>
        <div id="roomView" hidden>
          <div class="muted">Dein Raum – Spieler im Raum</div>
          <div class="code" id="roomCount">1 von 2</div>
          <ul class="rooms" id="members" style="margin-top: 8px"></ul>
          <div style="display: flex; gap: 8px; margin-top: 12px">
            <button class="primary" id="btnStart" style="flex: 1" disabled>
              Spiel starten</button
            ><button id="btnLeave">Verlassen</button>
          </div>
          <div
            class="muted"
            id="roomHint"
            style="margin-top: 8px; font-size: 0.9rem"
          ></div>
        </div>
        <div class="status" id="status">Verbinde …</div>
      </div>
    </section>
    <section id="game">
      <canvas id="cv" width="640" height="320"></canvas>
      <div class="hud"><span id="who"></span> <span id="ping"></span></div>
      <div class="pad">
        <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
        <div class="btns">
          <button id="bP">👊<small>Schlag</small></button
          ><button id="bK">🦵<small>Tritt</small></button>
        </div>
      </div>
      <button class="primary" id="btnAgain" hidden>Nochmal spielen</button>
    </section>
    <button id="mute" aria-label="Ton an/aus">🔊</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
    <script>
      // === HIER EINTRAGEN (Supabase → Project Settings → API) ===
      var SUPABASE_URL = "https://abedlprtacoplkuuzcxm.supabase.co";
      var SUPABASE_KEY = "sb_publishable_57vn_u0QVk-_hLZwmwKYlw_lNiznF7A";
      // ==========================================================
      var STUN = [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
      ];

      var $ = function (id) {
        return document.getElementById(id);
      };
      function setStatus(t) {
        $("status").textContent = t;
      }
      function rnd(n, al) {
        var s = "";
        for (var i = 0; i < n; i++)
          s += al[Math.floor(Math.random() * al.length)];
        return s;
      }

      /* ---------- Ton: Musik und Effekte werden direkt im Browser erzeugt (keine Audiodateien) ---------- */
      var TITLE_IMG = ""; // optional: Pfad zu eigenem Titelbild, z. B. 'titel.png'
      if (TITLE_IMG) {
        $("titleImg").src = TITLE_IMG;
        $("titleImg").hidden = false;
        $("logo").style.display = "none";
      }
      var AC = null,
        master = null,
        noiseBuf = null,
        musicMode = null,
        seqT = null,
        seqI = 0,
        seqNext = 0,
        muted = false;
      function audioInit() {
        if (!AC) {
          try {
            AC = new (window.AudioContext || window.webkitAudioContext)();
            master = AC.createGain();
            master.gain.value = muted ? 0 : 0.5;
            master.connect(AC.destination);
            noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
            var d = noiseBuf.getChannelData(0);
            for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          } catch (e) {
            AC = null;
            return;
          }
          seqRestart();
        }
        if (AC.state === "suspended") AC.resume();
      }
      ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
        addEventListener(ev, audioInit, { passive: true });
      });
      function mf(n) {
        return 440 * Math.pow(2, (n - 69) / 12);
      }
      function tone(f, t, d, type, v, f2) {
        var o = AC.createOscillator(),
          g = AC.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(v, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + d + 0.03);
      }
      function nz(t, d, v, hp) {
        var s = AC.createBufferSource(),
          f = AC.createBiquadFilter(),
          g = AC.createGain();
        s.buffer = noiseBuf;
        f.type = "highpass";
        f.frequency.value = hp;
        g.gain.setValueAtTime(v, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        s.connect(f);
        f.connect(g);
        g.connect(master);
        s.start(t);
        s.stop(t + d + 0.03);
      }
      var BASS = [
          33, 33, 36, 33, 33, 33, 38, 36, 33, 33, 36, 33, 31, 31, 34, 35,
        ],
        LEAD = [69, 72, 76, 72, 69, 72, 79, 76];
      function playStep(i, t) {
        var k = i % 16;
        if (musicMode === "battle") {
          if (k % 4 === 0) tone(150, t, 0.16, "sine", 0.7, 45);
          if (k === 4 || k === 12) {
            nz(t, 0.14, 0.35, 1500);
            tone(190, t, 0.08, "triangle", 0.25);
          }
          if (k % 2 === 0) nz(t, 0.04, 0.12, 7000);
          tone(mf(BASS[k]), t, 0.13, "sawtooth", 0.16);
          if (k % 2 === 0)
            tone(mf(LEAD[(k >> 1) % 8]), t, 0.18, "square", 0.06);
        } else {
          if (k % 8 === 0) tone(130, t, 0.22, "sine", 0.5, 45);
          if (k === 4 || k === 12) nz(t, 0.05, 0.1, 7000);
          if (k % 4 === 0)
            tone(mf([45, 45, 41, 43][k >> 2]), t, 0.5, "triangle", 0.2);
          tone(
            mf([57, 60, 64, 67, 64, 60, 55, 60][k >> 1] + (k % 2 ? 12 : 0)),
            t,
            0.3,
            "sine",
            0.07,
          );
        }
      }
      function seqTick() {
        var spb = 60 / (musicMode === "battle" ? 150 : 88) / 4;
        while (seqNext < AC.currentTime + 0.2) {
          playStep(seqI++, seqNext);
          seqNext += spb;
        }
      }
      function seqRestart() {
        clearInterval(seqT);
        seqT = null;
        if (!AC || !musicMode) return;
        seqI = 0;
        seqNext = AC.currentTime + 0.08;
        seqT = setInterval(seqTick, 50);
      }
      function music(m) {
        if (m === musicMode) return;
        musicMode = m;
        seqRestart();
      }
      function sfx(k) {
        if (!AC || muted) return;
        var t = AC.currentTime + 0.005;
        if (k === "w") nz(t, 0.07, 0.14, 2500);
        else if (k === "h") {
          nz(t, 0.07, 0.5, 900);
          tone(190, t, 0.11, "sine", 0.7, 80);
        } else if (k === "H") {
          nz(t, 0.14, 0.7, 500);
          tone(140, t, 0.22, "sine", 0.9, 40);
          tone(90, t, 0.12, "square", 0.15, 50);
        } else if (k === "u") {
          tone(260, t, 0.2, "sawtooth", 0.25, 90);
          nz(t, 0.1, 0.3, 1200);
        }
      }
      $("mute").onclick = function () {
        muted = !muted;
        $("mute").textContent = muted ? "🔇" : "🔊";
        if (master) master.gain.value = muted ? 0 : 0.5;
      };
      music("lobby"); // startet nach der ersten Berührung (Browser-Vorgabe)

      /* ---------- Lobby (Presence) + Verbindungsaufbau (Broadcast), Spiel selbst läuft über WebRTC ---------- */
      var client = null,
        channel = null,
        pc = null,
        dc = null,
        role = null,
        pendingIce = [],
        connected = false,
        startTimer = null;
      var pid = rnd(10, "abcdefghijklmnopqrstuvwxyz0123456789");
      var myName = "Spieler-" + rnd(4, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789");
      var myRoom = null,
        isHost = false,
        joinedAt = 0,
        peerPid = null,
        hostPid = null,
        players = [];

      function sig(m) {
        m.from = pid;
        channel.send({ type: "broadcast", event: "signal", payload: m });
      }
      function track() {
        return channel.track({
          pid: pid,
          name: myName,
          room: myRoom,
          isHost: isHost,
          joinedAt: joinedAt,
        });
      }

      function roomMembers(id) {
        return players
          .filter(function (p) {
            return p.room === id;
          })
          .sort(function (a, b) {
            return (
              Number(b.isHost) - Number(a.isHost) ||
              a.joinedAt - b.joinedAt ||
              (a.pid < b.pid ? -1 : 1)
            );
          });
      }
      function membersOf(id) {
        // wie roomMembers, enthält aber sofort auch mich selbst
        var m = roomMembers(id);
        if (
          id === myRoom &&
          !m.some(function (p) {
            return p.pid === pid;
          })
        )
          m = m
            .concat([
              {
                pid: pid,
                name: myName,
                room: myRoom,
                isHost: isHost,
                joinedAt: joinedAt,
              },
            ])
            .sort(function (a, b) {
              return (
                Number(b.isHost) - Number(a.isHost) ||
                a.joinedAt - b.joinedAt ||
                (a.pid < b.pid ? -1 : 1)
              );
            });
        return m;
      }

      function init() {
        if (SUPABASE_URL.indexOf("DEIN-PROJEKT") > -1) {
          setStatus(
            "Bitte zuerst SUPABASE_URL und SUPABASE_KEY im Code eintragen.",
          );
          $("btnOpen").disabled = true;
          return;
        }
        if (!window.supabase) {
          setStatus("Supabase-Bibliothek konnte nicht geladen werden.");
          $("btnOpen").disabled = true;
          return;
        }
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        channel = client.channel("kampf-lobby", {
          config: { presence: { key: pid }, broadcast: { self: false } },
        });
        channel.on("presence", { event: "sync" }, onSync);
        channel.on("broadcast", { event: "signal" }, function (e) {
          handleSignal(e.payload).catch(function () {});
        });
        channel.subscribe(function (st) {
          if (st === "SUBSCRIBED") {
            track();
            setStatus("");
          } else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT")
            setStatus("Verbindungsfehler zu Supabase. Prüfe URL und Key.");
        });
      }

      function onSync() {
        var st = channel.presenceState();
        players = Object.keys(st).map(function (k) {
          return st[k][st[k].length - 1];
        });
        if (myRoom && !connected) {
          var m = roomMembers(myRoom);
          var host = m.filter(function (p) {
            return p.isHost;
          })[0];
          if (!host) {
            leaveRoom("Der Ersteller hat den Raum geschlossen.");
            return;
          }
          hostPid = host.pid;
          var rank = m
            .map(function (p) {
              return p.pid;
            })
            .indexOf(pid);
          if (!isHost && rank >= 2) {
            leaveRoom("Der Raum war schon voll.");
            return;
          }
          var other = m.slice(0, 2).filter(function (p) {
            return p.pid !== pid;
          })[0];
          peerPid = other ? other.pid : null;
        }
        render();
      }

      function render() {
        var inRoom = !!myRoom;
        $("lobbyView").hidden = inRoom;
        $("roomView").hidden = !inRoom;
        $("online").textContent = players.length + " online";
        if (!inRoom) {
          var ul = $("rooms");
          ul.innerHTML = "";
          var hosts = players.filter(function (p) {
            return p.isHost && p.room;
          });
          if (!hosts.length) {
            var e = document.createElement("li");
            e.className = "muted";
            e.textContent = "Noch kein Raum offen. Öffne den ersten.";
            ul.appendChild(e);
          }
          hosts.forEach(function (h) {
            var n = Math.min(2, roomMembers(h.room).length),
              full = n >= 2;
            var li = document.createElement("li");
            li.className = "room" + (full ? " full" : "");
            var nm = document.createElement("span");
            nm.textContent = "Raum von " + h.name;
            var c = document.createElement("span");
            c.className = "cnt";
            c.textContent = n + " von 2" + (full ? " · voll" : "");
            li.appendChild(nm);
            li.appendChild(c);
            if (!full)
              li.onclick = function () {
                joinRoom(h.room);
              };
            ul.appendChild(li);
          });
        } else {
          var m = membersOf(myRoom).slice(0, 2),
            n = m.length;
          $("roomCount").textContent = n + " von 2";
          var ml = $("members");
          ml.innerHTML = "";
          m.forEach(function (p) {
            var li = document.createElement("li");
            var nm = document.createElement("span");
            nm.textContent = p.name;
            li.appendChild(nm);
            if (p.isHost) {
              var t = document.createElement("span");
              t.className = "tag";
              t.textContent = "Ersteller";
              li.appendChild(t);
            }
            if (p.pid === pid) {
              var t2 = document.createElement("span");
              t2.className = "tag";
              t2.textContent = "Du";
              li.appendChild(t2);
            }
            ml.appendChild(li);
          });
          $("btnStart").hidden = !isHost;
          $("btnStart").disabled = !(isHost && !pc && !started);
          $("roomHint").textContent = isHost
            ? n < 2
              ? "Du kannst allein starten oder auf einen Mitspieler warten (max. 2)."
              : "Ein Mitspieler ist da. Du kannst starten."
            : "Warte, bis der Ersteller das Spiel startet …";
        }
      }

      function openRoom() {
        if (myRoom || !channel) return;
        myRoom = pid;
        isHost = true;
        role = "host";
        joinedAt = Date.now();
        hostPid = pid;
        peerPid = null;
        track();
        render();
      }
      function joinRoom(id) {
        if (myRoom || !channel) return;
        if (roomMembers(id).length >= 2) return;
        myRoom = id;
        isHost = false;
        role = "guest";
        joinedAt = Date.now();
        hostPid = id;
        track();
        render();
      }
      function resetPC() {
        clearTimeout(startTimer);
        try {
          if (pc) pc.close();
        } catch (e) {}
        pc = null;
        dc = null;
        pendingIce = [];
      }
      function leaveRoom(text) {
        resetPC();
        myRoom = null;
        isHost = false;
        role = null;
        peerPid = null;
        hostPid = null;
        if (channel && !connected) track();
        setStatus(text || "");
        render();
      }
      $("btnOpen").onclick = openRoom;
      $("btnLeave").onclick = function () {
        leaveRoom("");
      };
      $("btnStart").onclick = async function () {
        if (!isHost || pc || started) return;
        if (!peerPid || membersOf(myRoom).slice(0, 2).length < 2) {
          started = true;
          try {
            channel.untrack();
            client.removeChannel(channel);
          } catch (e) {}
          startGame(false);
          return;
        }
        $("btnStart").disabled = true;
        setStatus("Verbinde direkt …");
        createPC();
        dc = pc.createDataChannel("game", {
          ordered: false,
          maxRetransmits: 0,
        });
        setupDC();
        var o = await pc.createOffer();
        await pc.setLocalDescription(o);
        sig({ type: "offer", to: peerPid, sdp: { type: o.type, sdp: o.sdp } });
        startTimer = setTimeout(function () {
          if (!connected) {
            resetPC();
            setStatus(
              "Direktverbindung fehlgeschlagen (Firewall/Mobilfunk). Dafür bräuchte man einen TURN-Server.",
            );
            render();
          }
        }, 15000);
      };

      function createPC() {
        pc = new RTCPeerConnection({ iceServers: STUN });
        pc.onicecandidate = function (e) {
          var to = isHost ? peerPid : hostPid;
          if (e.candidate && to)
            sig({ type: "ice", to: to, cand: e.candidate.toJSON() });
        };
        pc.onconnectionstatechange = function () {
          if (
            connected &&
            (pc.connectionState === "failed" ||
              pc.connectionState === "disconnected" ||
              pc.connectionState === "closed")
          )
            onLost();
        };
      }
      function flushIce() {
        pendingIce.forEach(function (c) {
          pc.addIceCandidate(c).catch(function () {});
        });
        pendingIce = [];
      }
      async function handleSignal(m) {
        if (m.to !== pid || connected) return;
        if (
          m.type === "offer" &&
          !isHost &&
          myRoom &&
          m.from === hostPid &&
          !pc
        ) {
          setStatus("Spiel startet, verbinde direkt …");
          createPC();
          pc.ondatachannel = function (e) {
            dc = e.channel;
            setupDC();
          };
          await pc.setRemoteDescription(m.sdp);
          flushIce();
          var a = await pc.createAnswer();
          await pc.setLocalDescription(a);
          sig({
            type: "answer",
            to: m.from,
            sdp: { type: a.type, sdp: a.sdp },
          });
        } else if (
          m.type === "answer" &&
          isHost &&
          pc &&
          m.from === peerPid &&
          !pc.remoteDescription
        ) {
          await pc.setRemoteDescription(m.sdp);
          flushIce();
        } else if (m.type === "ice") {
          if (pc && pc.remoteDescription)
            pc.addIceCandidate(m.cand).catch(function () {});
          else pendingIce.push(m.cand);
        }
      }
      function setupDC() {
        dc.onopen = function () {
          connected = true;
          clearTimeout(startTimer);
          setStatus("");
          // Lobby verlassen: Raum verschwindet für alle anderen, Vermittlung wird nicht mehr gebraucht
          try {
            channel.untrack();
            client.removeChannel(channel);
          } catch (e) {}
          startGame(true);
        };
        dc.onmessage = function (e) {
          var m;
          try {
            m = JSON.parse(e.data);
          } catch (x) {
            return;
          }
          onNet(m);
        };
        dc.onclose = onLost;
      }
      function send(o) {
        if (dc && dc.readyState === "open") dc.send(JSON.stringify(o));
      }
      function onLost() {
        if (!running || !multi) return;
        if (role === "host") {
          P[1].present = false;
          multi = false;
          $("ping").textContent = "Mitspieler getrennt";
        } else {
          running = false;
          $("ping").textContent = "Verbindung getrennt";
          msgText = "Ersteller getrennt";
        }
      }
      init();

      /* ---------- Spiel: Koop-Beat-’em-up (Ersteller berechnet Gegner, jeder steuert seine Figur selbst) ---------- */
      var W = 640,
        H = 320,
        LW = 3000,
        BAND = 190,
        BZ = 90;
      var cv = $("cv"),
        ctx = cv.getContext("2d");
      var started = false,
        running = false,
        multi = false,
        rtt = 0,
        msgText = "",
        gen = 0,
        tick = 0,
        me = 0;
      var P = [],
        E = [],
        cam = 0,
        camT = 0,
        waveI = 0,
        queue = [],
        qt = 0,
        wLock = -1,
        score = 0,
        over = 0,
        nextId = 1,
        hitG = 0,
        hitDir = 1,
        lastHg = 0;
      var keys = { l: 0, r: 0, u: 0, d: 0 },
        joy = { x: 0, y: 0 },
        buf = { p: 0, k: 0 };
      // Schlag: schnell, wenig Schaden. Tritt: langsamer, mehr Schaden, größere Reichweite
      var ATK = {
        1: { d: 12, a: 3, b: 7, r: 46, dmg: 8, kb: 3, st: 10 },
        2: { d: 26, a: 9, b: 15, r: 64, dmg: 18, kb: 9, st: 20 },
      };
      var KIND = [
        { hp: 30, sp: 1.1, dmg: 8, r: 34, c: "#c0504d", w: 34, h: 66 },
        { hp: 70, sp: 0.9, dmg: 12, r: 38, c: "#8e44ad", w: 42, h: 78 },
        { hp: 220, sp: 0.8, dmg: 16, r: 46, c: "#d48a1a", w: 54, h: 94 },
      ];
      var WAVES = [
        {
          at: 260,
          l: [
            [0, 0],
            [0, 40],
          ],
        },
        {
          at: 900,
          l: [
            [0, 0],
            [0, 30],
            [0, 60],
          ],
        },
        {
          at: 1500,
          l: [
            [0, 0],
            [0, 30],
            [1, 70],
          ],
        },
        {
          at: 2100,
          l: [
            [0, 0],
            [0, 25],
            [1, 50],
            [0, 80],
          ],
        },
        {
          at: 2360,
          l: [
            [2, 0],
            [0, 60],
            [0, 120],
          ],
        },
      ];

      function np(i) {
        return {
          x: 60 + i * 40,
          z: 30 + i * 30,
          f: 1,
          hp: 100,
          at: 0,
          af: 0,
          id: 0,
          st: 0,
          kx: 0,
          inv: 0,
          fl: 0,
          ph: 0,
          dead: false,
          present: true,
          tx: 0,
          tz: 0,
        };
      }
      function resetWorld() {
        P = [np(0), np(1)];
        P[1].present = multi;
        P[0].tx = P[0].x;
        P[0].tz = P[0].z;
        if (started) music("battle");
        E = [];
        cam = camT = 0;
        waveI = 0;
        queue = [];
        qt = 0;
        wLock = -1;
        score = 0;
        over = 0;
        msgText = "";
        hitG = 0;
        lastHg = 0;
        buf.p = buf.k = 0;
        $("btnAgain").hidden = true;
      }
      function startGame(m) {
        multi = m;
        started = true;
        me = role === "guest" ? 1 : 0;
        $("lobby").style.display = "none";
        $("game").style.display = "flex";
        $("who").textContent = multi
          ? "Du bist Spieler " + (me + 1)
          : "Einzelspiel";
        resetWorld();
        running = true;
        last = performance.now();
        acc = 0;
        requestAnimationFrame(frame);
        if (multi)
          setInterval(function () {
            send({ t: "p", ts: performance.now() });
          }, 1000);
      }

      /* ----- Netzwerk ----- */
      function onNet(m) {
        if (m.t === "g" && role === "host" && P[1]) {
          var q = P[1];
          q.x = m.x;
          q.z = m.z;
          q.f = m.f;
          q.at = m.a;
          q.af = m.af;
          q.id = m.id;
        } else if (m.t === "w" && role === "guest") {
          if (m.g !== gen) {
            gen = m.g;
            resetWorld();
            me = 1;
          }
          camT = m.c;
          score = m.s;
          over = m.o;
          if (over) music(null);
          waveI = m.w;
          wLock = m.l ? 1 : -1;
          var h = P[0];
          h.tx = m.p[0];
          h.tz = m.p[1];
          h.f = m.p[2];
          h.at = m.p[3];
          h.af = m.p[4];
          h.dead = !!m.p[5];
          if (m.h[0] < h.hp) sfx("u");
          h.hp = m.h[0];
          var g = P[1];
          g.hp = m.h[1];
          if (g.hp <= 0) g.dead = true;
          if (m.hg[0] > lastHg) {
            lastHg = m.hg[0];
            sfx("u");
            g.st = 14;
            g.kx = m.hg[1] * 4;
            g.fl = 8;
            g.at = 0;
            g.inv = 45;
          }
          var old = {};
          E.forEach(function (e) {
            old[e.id] = e;
          });
          E = m.e.map(function (a) {
            var o = old[a[0]] || { x: a[2], z: a[3] };
            if (old[a[0]] && a[4] < o.hp) sfx(o.hp - a[4] >= 15 ? "H" : "h");
            return {
              id: a[0],
              k: a[1],
              x: o.x,
              z: o.z,
              tx: a[2],
              tz: a[3],
              hp: a[4],
              st: a[5],
              f: a[6],
              t: a[7],
            };
          });
        } else if (m.t === "p") send({ t: "r", ts: m.ts });
        else if (m.t === "r") {
          rtt = performance.now() - m.ts;
          $("ping").textContent = "Ping: " + Math.round(rtt) + " ms";
        }
      }
      function sendSnap() {
        send({
          t: "w",
          g: gen,
          c: Math.round(cam),
          s: score,
          o: over,
          w: waveI,
          l: wLock >= 0 ? 1 : 0,
          h: [P[0].hp, P[1].hp],
          hg: [hitG, hitDir],
          p: [
            Math.round(P[0].x),
            Math.round(P[0].z),
            P[0].f,
            P[0].at,
            P[0].af,
            P[0].dead ? 1 : 0,
          ],
          e: E.map(function (e) {
            return [
              e.id,
              e.k,
              Math.round(e.x),
              Math.round(e.z),
              e.hp,
              e.st,
              e.f,
              e.t,
            ];
          }),
        });
      }

      /* ----- Spieler ----- */
      function stepLocal(p) {
        if (p.fl > 0) p.fl--;
        if (p.dead || over) return;
        if (p.inv > 0) p.inv--;
        if (p.st > 0) {
          p.st--;
          p.x += p.kx;
          p.kx *= 0.8;
        } else if (p.at) {
          p.af++;
          if (p.af >= ATK[p.at].d) p.at = 0;
        } else {
          var mx = keys.r - keys.l + joy.x,
            mz = keys.d - keys.u + joy.y,
            m = Math.hypot(mx, mz);
          if (m > 1) {
            mx /= m;
            mz /= m;
          }
          if (m > 0.15) {
            p.x += mx * 2.4;
            p.z += mz * 1.7;
            if (Math.abs(mx) > 0.2) p.f = mx > 0 ? 1 : -1;
            p.ph += 0.25;
          }
          if (buf.k > 0) {
            p.at = 2;
            p.af = 0;
            p.id++;
            buf.k = buf.p = 0;
            sfx("w");
          } else if (buf.p > 0) {
            p.at = 1;
            p.af = 0;
            p.id++;
            buf.k = buf.p = 0;
            sfx("w");
          }
        }
        if (buf.p > 0) buf.p--;
        if (buf.k > 0) buf.k--;
        p.x = Math.max(
          cam + 14,
          Math.min(Math.min(cam + W - 14, LW - 14), p.x),
        );
        p.z = Math.max(0, Math.min(BZ, p.z));
      }
      function hurtPlayer(i, d, dir) {
        sfx("u");
        var p = P[i];
        p.hp = Math.max(0, p.hp - d);
        p.inv = 45;
        p.st = 14;
        p.kx = dir * 4;
        p.fl = 8;
        p.at = 0;
        if (p.hp <= 0) p.dead = true;
        if (i === 1) {
          hitG++;
          hitDir = dir;
        }
      }

      /* ----- Ersteller: Gegner, Wellen, Kamera ----- */
      function applyAttack(p, i) {
        if (!p.present || p.dead || !p.at) return;
        var a = ATK[p.at];
        if (p.af < a.a || p.af > a.b) return;
        E.forEach(function (e) {
          if (e.st === 3) return;
          var K = KIND[e.k],
            fd = (e.x - p.x) * p.f;
          if (
            fd < -8 ||
            fd > a.r + K.w / 2 ||
            Math.abs(e.z - p.z) > 16 ||
            e.hb[i] === p.id
          )
            return;
          e.hb[i] = p.id;
          e.hp -= a.dmg;
          sfx(p.at === 2 ? "H" : "h");
          score += a.dmg;
          e.f = -p.f;
          if (e.hp <= 0) {
            e.st = 3;
            e.t = 40;
            score += 50;
          } else if (e.k < 2 || p.at === 2) {
            e.st = 2;
            e.t = a.st;
            e.kx = p.f * a.kb;
          }
        });
      }
      function spawn(k) {
        var right = Math.random() < 0.6;
        E.push({
          id: nextId++,
          k: k,
          x: right ? cam + W + 20 : cam - 20,
          z: Math.random() * BZ,
          hp: KIND[k].hp,
          f: right ? -1 : 1,
          st: 0,
          t: 0,
          cd: 40,
          kx: 0,
          hb: [0, 0],
        });
      }
      function stepEnemies() {
        var alive = P.filter(function (p) {
          return p.present && !p.dead;
        });
        E.forEach(function (e) {
          var K = KIND[e.k];
          if (e.st === 3) {
            e.t--;
            return;
          }
          if (e.st === 2) {
            e.t--;
            e.x += e.kx;
            e.kx *= 0.85;
            if (e.t <= 0) e.st = 0;
            return;
          }
          if (e.cd > 0) e.cd--;
          var tg = null,
            bd = 1e9;
          alive.forEach(function (p) {
            var d = Math.abs(p.x - e.x) + Math.abs(p.z - e.z);
            if (d < bd) {
              bd = d;
              tg = p;
            }
          });
          if (!tg) return;
          var dx = tg.x - e.x,
            dz = tg.z - e.z;
          if (e.st === 1) {
            e.t--;
            if (e.t === 10)
              P.forEach(function (p, i) {
                if (!p.present || p.dead || p.inv > 0) return;
                var fd = (p.x - e.x) * e.f;
                if (fd >= -6 && fd <= K.r + 10 && Math.abs(p.z - e.z) <= 16)
                  hurtPlayer(i, K.dmg, e.f);
              });
            if (e.t <= 0) {
              e.st = 0;
              e.cd = 50 + ((Math.random() * 40) | 0);
            }
            return;
          }
          e.f = dx > 0 ? 1 : -1;
          if (Math.abs(dz) > 5) e.z += Math.sign(dz) * K.sp * 0.8;
          if (Math.abs(dx) > K.r - 8) e.x += Math.sign(dx) * K.sp;
          else if (Math.abs(dz) <= 14 && e.cd <= 0) {
            e.st = 1;
            e.t = 24;
          }
        });
        for (var i = 0; i < E.length; i++)
          for (var j = i + 1; j < E.length; j++) {
            var a = E[i],
              b = E[j];
            if (
              a.st !== 3 &&
              b.st !== 3 &&
              Math.abs(a.x - b.x) < 18 &&
              Math.abs(a.z - b.z) < 8
            ) {
              var s = a.x <= b.x ? -0.6 : 0.6;
              a.x += s;
              b.x -= s;
            }
          }
        E = E.filter(function (e) {
          return !(e.st === 3 && e.t <= 0);
        });
      }
      function stepWorld() {
        var alive = P.filter(function (p) {
          return p.present && !p.dead;
        });
        if (!alive.length) {
          if (!over) {
            over = 2;
            $("btnAgain").hidden = false;
          }
          return;
        }
        if (over) return;
        var mx = Math.max.apply(
          null,
          alive.map(function (p) {
            return p.x;
          }),
        );
        var target = Math.max(0, Math.min(LW - W, mx - W * 0.45));
        var w = WAVES[waveI];
        if (wLock < 0 && w && target >= w.at) {
          wLock = w.at;
          qt = 0;
          queue = w.l.slice();
          if (multi) queue.push([0, w.l[w.l.length - 1][1] + 25]);
        }
        if (wLock >= 0) {
          target = Math.min(target, wLock);
          qt++;
          while (queue.length && queue[0][1] <= qt) spawn(queue.shift()[0]);
          if (!queue.length && !E.length) {
            wLock = -1;
            waveI++;
            if (waveI >= WAVES.length) {
              over = 1;
              $("btnAgain").hidden = false;
            }
          }
        }
        if (target > cam) cam += (target - cam) * 0.08;
      }

      function step() {
        tick++;
        if (role !== "guest") {
          stepLocal(P[0]);
          if (P[1].present) P[1].fl > 0 && P[1].fl--;
          applyAttack(P[0], 0);
          if (P[1].present) applyAttack(P[1], 1);
          stepEnemies();
          stepWorld();
          if (over) music(null);
          if (multi && tick % 2 === 0) sendSnap();
        } else {
          var g = P[1],
            h = P[0];
          stepLocal(g);
          h.x += (h.tx - h.x) * 0.5;
          h.z += (h.tz - h.z) * 0.5;
          E.forEach(function (e) {
            e.x += (e.tx - e.x) * 0.5;
            e.z += (e.tz - e.z) * 0.5;
          });
          cam += (camT - cam) * 0.3;
          send({
            t: "g",
            x: Math.round(g.x * 10) / 10,
            z: Math.round(g.z * 10) / 10,
            f: g.f,
            a: g.at,
            af: g.af,
            id: g.id,
          });
        }
      }

      /* ----- Zeichnen ----- */
      var SP1 = {
          sk: "#f0c8a0",
          top: "#2f6fed",
          pants: "#1d2744",
          hair: "#2a1a10",
          acc: "band",
          ac: "#e5484d",
        },
        SP2 = {
          sk: "#e8b890",
          top: "#1fae6b",
          pants: "#183a2c",
          hair: "#f0c24a",
          acc: "band",
          ac: "#ffd24a",
        },
        KS = [
          {
            sk: "#e0b890",
            top: "#c0392b",
            pants: "#2a2a33",
            hair: "#8e44ad",
            acc: "mohawk",
          },
          {
            sk: "#d9a77c",
            top: "#4a3a7a",
            pants: "#1c1c2e",
            hair: "#222",
            acc: "hood",
          },
          {
            sk: "#c98f68",
            top: "#d48a1a",
            pants: "#3a2a10",
            hair: "#111",
            acc: "shades",
          },
        ];
      function limb(a, b, c, d, w, col) {
        ctx.strokeStyle = col;
        ctx.lineWidth = w;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(a, b);
        ctx.lineTo(c, d);
        ctx.stroke();
      }
      function dot(x, y, r, c) {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 7);
        ctx.fill();
      }
      function figure(x, z, f, S, w, h, at, af, fl, lie, ph, windup, strike) {
        var sx = x - cam,
          fy = BAND + z;
        ctx.fillStyle = "rgba(0,0,0,.4)";
        ctx.beginPath();
        ctx.ellipse(sx, fy, w * 0.65, 6, 0, 0, 7);
        ctx.fill();
        ctx.save();
        ctx.translate(sx, fy);
        ctx.scale(f, 1);
        if (lie) {
          ctx.rotate(-1.45);
          ctx.globalAlpha = Math.max(0.4, lie);
        } else if (fl) ctx.rotate(-0.12);
        var sw = Math.sin(ph) * 9,
          hip = -h * 0.44,
          sh = -h * 0.74,
          hd = -h * 0.9,
          s = w / 36,
          a = at ? ATK[at] : null,
          act = a && af >= a.a && af <= a.b,
          lw = 11 * s,
          O = "#12141a";
        limb(0, hip, -sw - 3, -4, lw, S.pants);
        dot(-sw - 2, -3, 6 * s, O); // hinteres Bein
        limb(-2, sh + 2, -9, sh + h * 0.2, 8 * s, S.sk); // hinterer Arm
        limb(0, hip, 0, sh, w * 0.64, S.top);
        limb(-w * 0.3, hip - 2, w * 0.3, hip - 2, 4, "rgba(0,0,0,.35)"); // Oberkörper, Gürtel
        limb(-w * 0.22, sh + 2, -w * 0.22, hip - 4, 3, "rgba(255,255,255,.18)");
        if (at === 2 && act) {
          limb(0, hip, a.r - 12, hip - 8, lw, S.pants);
          dot(a.r - 8, hip - 8, 7 * s, O);
        } // Tritt
        else {
          limb(0, hip, sw + 3, -4, lw, S.pants);
          dot(sw + 5, -3, 6 * s, O);
        } // vorderes Bein
        if (S.acc === "hood") dot(-2, hd + 1, h * 0.15, S.top);
        dot(2, hd, h * 0.12, S.sk);
        if (S.acc !== "hood") {
          ctx.fillStyle = S.hair;
          ctx.beginPath();
          ctx.arc(1, hd - 1, h * 0.125, Math.PI * 0.95, Math.PI * 2.05);
          ctx.fill();
        }
        if (S.acc === "band") {
          ctx.fillStyle = S.ac;
          ctx.fillRect(-8, hd - 7, 21, 4);
          ctx.fillRect(-18, hd - 6, 11, 3);
        }
        if (S.acc === "mohawk") {
          ctx.fillStyle = S.hair;
          ctx.fillRect(-2, hd - h * 0.2, 9, h * 0.1);
        }
        if (S.acc === "shades") {
          ctx.fillStyle = "#0a0a0a";
          ctx.fillRect(3, hd - 4, 11, 5);
        } else dot(8, hd, 1.8, O);
        var ax, ay;
        if (at === 1 && act) {
          ax = a.r - 8;
          ay = sh + 3;
        } else if (strike) {
          ax = 32;
          ay = sh + 4;
        } else if (windup) {
          ax = -10;
          ay = sh + 8;
        } else {
          ax = 9 + sw * 0.3;
          ay = sh + h * 0.2;
        }
        limb(2, sh + 2, ax, ay, 9 * s, S.sk);
        dot(ax, ay, 5.5 * s, S.sk); // vorderer Arm + Faust
        if (fl) {
          limb(0, hip, 0, sh, w * 0.64, "rgba(255,255,255,.75)");
          dot(2, hd, h * 0.12, "rgba(255,255,255,.7)");
        }
        ctx.restore();
      }
      function bar(x, w, hp, lbl, right) {
        ctx.fillStyle = "#2b2f39";
        ctx.fillRect(x, 10, w, 12);
        ctx.fillStyle = hp > 30 ? "#3ccf6a" : "#e5484d";
        var cw = (w * hp) / 100;
        ctx.fillRect(right ? x + w - cw : x, 10, cw, 12);
        ctx.fillStyle = "#fff";
        ctx.font = "11px system-ui";
        ctx.textAlign = right ? "right" : "left";
        ctx.fillText(lbl, right ? x + w : x, 36);
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        var gr = ctx.createLinearGradient(0, 0, 0, BAND);
        gr.addColorStop(0, "#141a28");
        gr.addColorStop(1, "#26324a");
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, H);
        for (var i = -1; i < 12; i++) {
          var bx = i * 70 - ((cam * 0.35) % 70),
            bh =
              60 +
              ((((Math.sin(i + Math.floor((cam * 0.35) / 70)) * 43758) % 1) +
                1) %
                1) *
                80;
          ctx.fillStyle = "#1d2536";
          ctx.fillRect(bx, BAND - bh, 60, bh);
        }
        ctx.fillStyle = "#2a2f3a";
        ctx.fillRect(0, BAND - 6, W, H - BAND + 6);
        ctx.fillStyle = "#343a47";
        for (var k = 0; k < 10; k++)
          ctx.fillRect(
            ((((k * 100 - cam) % 1000) + 1000) % 1000) - 100,
            BAND + BZ + 22,
            50,
            4,
          );
        var list = [];
        P.forEach(function (p, i) {
          if (p.present)
            list.push({
              z: p.z,
              d: function () {
                var col = i === 0 ? "#4c7dff" : "#3ccf6a";
                figure(
                  p.x,
                  p.z,
                  p.f,
                  i ? SP2 : SP1,
                  36,
                  68,
                  p.at,
                  p.af,
                  p.fl && p.fl % 4 < 2,
                  p.dead ? 1 : 0,
                  p.ph,
                );
                ctx.fillStyle = "#fff";
                ctx.font = "11px system-ui";
                ctx.textAlign = "center";
                if (i === me && !p.dead)
                  ctx.fillText("▼ Du", p.x - cam, BAND + p.z - 80);
              },
            });
        });
        E.forEach(function (e) {
          var K = KIND[e.k];
          list.push({
            z: e.z,
            d: function () {
              figure(
                e.x,
                e.z,
                e.f,
                KS[e.k],
                K.w,
                K.h,
                0,
                0,
                e.st === 2 && e.t % 4 < 2,
                e.st === 3 ? e.t / 40 : 0,
                e.x * 0.18,
                e.st === 1 && e.t > 10,
                e.st === 1 && e.t <= 10,
              );
              if (e.k > 0 && e.st !== 3) {
                var mh = KIND[e.k].hp,
                  bx = e.x - cam - 20,
                  by = BAND + e.z - K.h - 10;
                ctx.fillStyle = "#2b2f39";
                ctx.fillRect(bx, by, 40, 4);
                ctx.fillStyle = "#e5484d";
                ctx.fillRect(bx, by, (40 * Math.max(0, e.hp)) / mh, 4);
              }
            },
          });
        });
        list
          .sort(function (a, b) {
            return a.z - b.z;
          })
          .forEach(function (o) {
            o.d();
          });
        bar(10, 190, P[0].hp, me === 0 ? "Spieler 1 (Du)" : "Spieler 1", false);
        if (P[1] && P[1].present)
          bar(
            W - 200,
            190,
            P[1].hp,
            me === 1 ? "Spieler 2 (Du)" : "Spieler 2",
            true,
          );
        ctx.fillStyle = "#fff";
        ctx.font = "bold 13px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Punkte " + score, W / 2, 20);
        if (!over && wLock < 0 && cam < LW - W - 5 && (tick >> 5) % 2 === 0) {
          ctx.font = "bold 26px system-ui";
          ctx.fillStyle = "#ffd24a";
          ctx.fillText("GO ➜", W - 60, 60);
        }
        var t =
          msgText ||
          (over === 1 ? "Level geschafft!" : over === 2 ? "Game Over" : "");
        if (t) {
          ctx.fillStyle = "rgba(0,0,0,.55)";
          ctx.fillRect(0, H / 2 - 34, W, 68);
          ctx.fillStyle = "#fff";
          ctx.font = "bold 34px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(t, W / 2, H / 2 + 12);
        }
      }

      var last = 0,
        acc = 0,
        DT = 1000 / 60;
      function frame(now) {
        acc += Math.min(now - last, 100);
        last = now;
        if (running)
          while (acc >= DT) {
            step();
            acc -= DT;
          }
        draw();
        if (running || msgText) requestAnimationFrame(frame);
      }
      $("btnAgain").onclick = function () {
        if (role === "guest") return;
        gen++;
        resetWorld();
      };

      /* ----- Eingabe ----- */
      var map = {
        ArrowLeft: "l",
        a: "l",
        A: "l",
        ArrowRight: "r",
        d: "r",
        D: "r",
        ArrowUp: "u",
        w: "u",
        W: "u",
        ArrowDown: "d",
        s: "d",
        S: "d",
      };
      addEventListener("keydown", function (e) {
        var k = map[e.key];
        if (k) {
          keys[k] = 1;
          e.preventDefault();
        }
        if (!e.repeat) {
          if (e.key === "j" || e.key === "J" || e.key === "f" || e.key === "F")
            buf.p = 8;
          if (e.key === "k" || e.key === "K" || e.key === "x" || e.key === "X")
            buf.k = 8;
        }
      });
      addEventListener("keyup", function (e) {
        var k = map[e.key];
        if (k) {
          keys[k] = 0;
          e.preventDefault();
        }
      });
      $("bP").addEventListener("pointerdown", function (e) {
        buf.p = 8;
        e.preventDefault();
      });
      $("bK").addEventListener("pointerdown", function (e) {
        buf.k = 8;
        e.preventDefault();
      });
      var J = $("joy"),
        KN = $("knob"),
        jid = null;
      function jset(e) {
        var r = J.getBoundingClientRect(),
          dx = e.clientX - (r.left + r.width / 2),
          dy = e.clientY - (r.top + r.height / 2),
          R = r.width / 2 - 6,
          d = Math.hypot(dx, dy);
        if (d > R) {
          dx *= R / d;
          dy *= R / d;
        }
        joy.x = dx / R;
        joy.y = dy / R;
        if (Math.hypot(joy.x, joy.y) < 0.2) joy.x = joy.y = 0;
        KN.style.transform = "translate(" + dx + "px," + dy + "px)";
      }
      J.addEventListener("pointerdown", function (e) {
        jid = e.pointerId;
        J.setPointerCapture(jid);
        jset(e);
        e.preventDefault();
      });
      J.addEventListener("pointermove", function (e) {
        if (e.pointerId === jid) jset(e);
      });
      ["pointerup", "pointercancel"].forEach(function (ev) {
        J.addEventListener(ev, function (e) {
          if (e.pointerId === jid) {
            jid = null;
            joy.x = joy.y = 0;
            KN.style.transform = "";
          }
        });
      });
      addEventListener("pagehide", function () {
        try {
          if (pc) pc.close();
        } catch (e) {}
      });
    </script>
  </body>
</html>
