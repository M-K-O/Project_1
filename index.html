<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Geräte-Board</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #fff;
        --text: #1b1f27;
        --muted: #6a7280;
        --line: #e3e6ec;
        --accent: #2f6fed;
        --me: #e8f0ff;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #14161b;
          --card: #1d2027;
          --text: #eceef3;
          --muted: #98a0b0;
          --line: #2b2f39;
          --accent: #6b9bff;
          --me: #22314f;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #14161b;
        --card: #1d2027;
        --text: #eceef3;
        --muted: #98a0b0;
        --line: #2b2f39;
        --accent: #6b9bff;
        --me: #22314f;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .me {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 20px;
      }
      .me small {
        color: var(--muted);
        display: block;
      }
      .me strong {
        font-size: 1.6rem;
        color: var(--accent);
        letter-spacing: 0.03em;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .count {
        color: var(--muted);
        font-size: 0.9rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      li:last-child {
        border-bottom: 0;
      }
      li.mine {
        background: var(--me);
      }
      .nr {
        min-width: 2.2em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .code {
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .dev {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: right;
      }
      .tag {
        font-size: 0.72rem;
        background: var(--accent);
        color: #fff;
        border-radius: 99px;
        padding: 1px 8px;
      }
      .msg {
        color: var(--muted);
        padding: 16px;
        text-align: center;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        margin-top: 16px;
      }
      button.danger {
        border-color: #d0443e;
        color: #d0443e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Geräte-Board</h1>
      <p class="sub">
        Jedes Gerät, das diese Seite öffnet, wird registriert und erscheint mit
        seiner ID in der Liste.
      </p>
      <section class="me" id="me" hidden>
        <small>Deine Geräte-ID</small>
        <strong id="myid">–</strong>
      </section>
      <div class="head">
        <h2 style="font-size: 1.05rem; margin: 0">Registrierte Geräte</h2>
        <span class="count" id="count"></span>
      </div>
      <ul id="list">
        <li class="msg">Verbinde …</li>
      </ul>
      <div id="admin"></div>
    </main>
    <script>
      (function () {
        var listEl = document.getElementById("list"),
          countEl = document.getElementById("count"),
          meEl = document.getElementById("me"),
          myIdEl = document.getElementById("myid"),
          adminEl = document.getElementById("admin");
        var mem = {};
        function store(k, v) {
          try {
            if (v === undefined) return localStorage.getItem(k);
            localStorage.setItem(k, v);
          } catch (e) {
            if (v === undefined) return mem[k] || null;
            mem[k] = v;
          }
        }
        function rnd(n, al) {
          var s = "";
          for (var i = 0; i < n; i++)
            s += al[Math.floor(Math.random() * al.length)];
          return s;
        }
        var token = store("device-token");
        if (!token) {
          token = rnd(24, "abcdefghijklmnopqrstuvwxyz0123456789");
          store("device-token", token);
        }
        function label() {
          var u = navigator.userAgent,
            os = "Gerät",
            br = "";
          if (/iPhone/.test(u)) os = "iPhone";
          else if (/iPad/.test(u)) os = "iPad";
          else if (/Android/.test(u)) os = "Android";
          else if (/Windows/.test(u)) os = "Windows";
          else if (/Mac OS X/.test(u)) os = "Mac";
          else if (/Linux/.test(u)) os = "Linux";
          if (/Edg\//.test(u)) br = "Edge";
          else if (/Firefox\//.test(u)) br = "Firefox";
          else if (/Chrome\//.test(u)) br = "Chrome";
          else if (/Safari\//.test(u)) br = "Safari";
          return br ? os + " · " + br : os;
        }
        function msg(t) {
          listEl.innerHTML = "";
          var li = document.createElement("li");
          li.className = "msg";
          li.textContent = t;
          listEl.appendChild(li);
        }
        var timer = setTimeout(function () {
          msg(
            "Keine Verbindung zur Datenbank. Bitte die Seite innerhalb von claude.ai öffnen und anmelden.",
          );
        }, 10000);

        var registering = false;
        async function init() {
          var db = await claude.use("db");
          if (!db) {
            clearTimeout(timer);
            msg(
              "Datenbank nicht verfügbar. Bitte anmelden und die Seite neu laden.",
            );
            return;
          }
          var user = await claude.use("user");
          var col = db.collection("devices");
          col.orderBy("createdAt", "asc").onSnapshot(
            function (snap) {
              clearTimeout(timer);
              var docs = snap.docs,
                mine = null;
              listEl.innerHTML = "";
              docs.forEach(function (d, i) {
                var v = d.data() || {},
                  isMe = d.id === token;
                if (isMe) mine = { nr: i + 1, code: v.code };
                var li = document.createElement("li");
                if (isMe) li.className = "mine";
                var nr = document.createElement("span");
                nr.className = "nr";
                nr.textContent = "#" + (i + 1);
                var code = document.createElement("span");
                code.className = "code";
                code.textContent = v.code || d.id.slice(0, 6).toUpperCase();
                li.appendChild(nr);
                li.appendChild(code);
                if (isMe) {
                  var t = document.createElement("span");
                  t.className = "tag";
                  t.textContent = "Du";
                  li.appendChild(t);
                }
                var dev = document.createElement("span");
                dev.className = "dev";
                dev.textContent = v.device || "";
                li.appendChild(dev);
                listEl.appendChild(li);
              });
              if (!docs.length) msg("Noch keine Geräte registriert.");
              countEl.textContent =
                docs.length + (docs.length === 1 ? " Gerät" : " Geräte");
              if (mine) {
                meEl.hidden = false;
                myIdEl.textContent = "#" + mine.nr + " · " + mine.code;
              } else if (!registering && !snap.metadata.fromCache) {
                registering = true;
                col
                  .doc(token)
                  .set({
                    code: "GER-" + rnd(4, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"),
                    createdAt: Date.now(),
                    device: label(),
                  })
                  .catch(function () {
                    registering = false;
                    meEl.hidden = false;
                    myIdEl.textContent = "Nur Ansicht (keine Schreibrechte)";
                  });
              }
            },
            function () {
              clearTimeout(timer);
              msg("Die Liste konnte nicht geladen werden.");
            },
          );

          var canEdit = user ? await user.canEdit() : false;
          if (canEdit) {
            var b = document.createElement("button");
            b.textContent = "Liste zurücksetzen";
            var armed = false;
            b.onclick = async function () {
              if (!armed) {
                armed = true;
                b.textContent = "Wirklich alle Geräte löschen?";
                b.className = "danger";
                return;
              }
              try {
                var s = await col.get();
                await Promise.all(
                  s.docs.map(function (d) {
                    return col.doc(d.id).delete();
                  }),
                );
              } catch (e) {}
              armed = false;
              b.textContent = "Liste zurücksetzen";
              b.className = "";
            };
            adminEl.appendChild(b);
          }
        }
        init().catch(function () {
          clearTimeout(timer);
          msg("Verbindungsfehler.");
        });
      })();
    </script>
  </body>
</html>
